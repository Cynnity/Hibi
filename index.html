<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hibi">
<meta name="theme-color" content="#F0467F">
<title>Hibi</title>
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ---------- Theme tokens ---------- */
:root{
  --bg:#FFF0F5;--surface:#FFFFFF;--surface-2:#FBE8F0;--ink:#2B1B52;--mute:#6F5F8F;--line:#EADCF2;
  --accent:#F0467F;--accent-2:#2BB8D0;--on-accent:#FFFFFF;--good:#0E9F8E;--good-soft:#D6F6F0;--danger:#C2243F;
  --body:#F5ECF8;--muscle:#DDCDEB;--panel:#F0467F;--g1:rgba(43,184,208,.20);--g2:rgba(240,70,127,.16);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-skin]){
    --bg:#150F2E;--surface:#201A45;--surface-2:#2A2357;--ink:#F3EEFF;--mute:#A99BD0;--line:#3A3066;
    --accent:#FF6FA3;--accent-2:#5CE1F5;--on-accent:#1B0F2E;--good:#43E0C8;--good-soft:#12403F;--danger:#FF8097;
    --body:#2C2560;--muscle:#463C82;--panel:#FF6FA3;--g1:rgba(92,225,245,.14);--g2:rgba(255,111,163,.14);color-scheme:dark}
}
:root[data-theme="dark"]:not([data-skin]){
  --bg:#150F2E;--surface:#201A45;--surface-2:#2A2357;--ink:#F3EEFF;--mute:#A99BD0;--line:#3A3066;
  --accent:#FF6FA3;--accent-2:#5CE1F5;--on-accent:#1B0F2E;--good:#43E0C8;--good-soft:#12403F;--danger:#FF8097;
  --body:#2C2560;--muscle:#463C82;--panel:#FF6FA3;--g1:rgba(92,225,245,.14);--g2:rgba(255,111,163,.14);color-scheme:dark}
:root[data-skin="midnight"]{--bg:#0B0F1A;--surface:#141B2D;--surface-2:#1C2540;--ink:#E8ECF8;--mute:#8F9BB8;--line:#263049;
  --accent:#8B6CFF;--accent-2:#4DD2FF;--on-accent:#0B0F1A;--good:#35D39A;--good-soft:#11352B;--danger:#FF7B8A;
  --body:#1E2742;--muscle:#323E63;--panel:#8B6CFF;--g1:rgba(139,108,255,.22);--g2:rgba(77,210,255,.12);color-scheme:dark}
:root[data-skin="ocean"]{--bg:#E8F5F9;--surface:#FFFFFF;--surface-2:#DDF0F5;--ink:#0E2A3A;--mute:#4F6E7E;--line:#C6E2EA;
  --accent:#0A86AA;--accent-2:#F2A541;--on-accent:#FFFFFF;--good:#0E9F6E;--good-soft:#D3F4E6;--danger:#C23B2B;
  --body:#E3F1F5;--muscle:#BFDCE5;--panel:#0A86AA;--g1:rgba(10,134,170,.16);--g2:rgba(242,165,65,.14);color-scheme:light}
:root[data-skin="forest"]{--bg:#161F18;--surface:#1F2B22;--surface-2:#28382C;--ink:#E9F2E4;--mute:#9DB3A0;--line:#34493A;
  --accent:#86D993;--accent-2:#E8C547;--on-accent:#102014;--good:#4FD1A1;--good-soft:#1C3D31;--danger:#FF8C7A;
  --body:#28382C;--muscle:#3C5442;--panel:#86D993;--g1:rgba(134,217,147,.12);--g2:rgba(232,197,71,.08);color-scheme:dark}
:root[data-skin="sunset"]{--bg:#FFF2E6;--surface:#FFFFFF;--surface-2:#FDE6D3;--ink:#3A1D14;--mute:#86563F;--line:#F2D6C0;
  --accent:#E8590C;--accent-2:#B5179E;--on-accent:#FFFFFF;--good:#2F9E6E;--good-soft:#DCF3E6;--danger:#B3261E;
  --body:#FBEADC;--muscle:#F0CDB5;--panel:#E8590C;--g1:rgba(255,179,71,.26);--g2:rgba(181,23,158,.10);color-scheme:light}
:root[data-skin="mono"]{--bg:#F3F3F1;--surface:#FFFFFF;--surface-2:#EDEDEA;--ink:#141414;--mute:#64645F;--line:#DADAD5;
  --accent:#141414;--accent-2:#7A7A74;--on-accent:#FFFFFF;--good:#1E8E5A;--good-soft:#DFF2E8;--danger:#B3261E;
  --body:#EEEEEB;--muscle:#D4D4CF;--panel:#141414;--g1:transparent;--g2:transparent;color-scheme:light}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);
  font:500 16px/1.45 "Zen Maru Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(120% 55% at 100% 0,var(--g1),transparent 60%),radial-gradient(90% 45% at 0 28%,var(--g2),transparent 60%),var(--bg);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent}
main{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 190px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.top{margin:0 0 16px}
.top h1{font:400 32px/1.1 "Dela Gothic One","Zen Maru Gothic",sans-serif;letter-spacing:.01em}
.top p{margin-top:4px;color:var(--mute);font-size:15px}
h2{font:400 18px/1.25 "Dela Gothic One","Zen Maru Gothic",sans-serif}
h3{font-size:17px;font-weight:900;line-height:1.25}
.sec{margin:24px 0 12px}
.muted{color:var(--mute)}
.small{font-size:14px}
.note{color:var(--mute);font-size:14px;margin-top:10px}
.mt{margin-top:12px}.mb{margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.label{display:block;color:var(--mute);font-size:14px;font-weight:700;margin:16px 0 8px}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--panel);padding:16px;margin:0 0 16px}
.card.flat{box-shadow:none;border-color:var(--line)}
.empty{padding:22px 16px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:16px;margin:0 0 16px}
.empty h2{color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.sum{display:flex;flex-direction:column;gap:2px;position:relative;padding-right:30px}
.sum::after{content:"";position:absolute;right:4px;top:50%;width:9px;height:9px;margin-top:-7px;border-right:2.5px solid var(--mute);border-bottom:2.5px solid var(--mute);transform:rotate(45deg);transition:transform .2s}
details[open]>.sum::after{transform:rotate(225deg);margin-top:-2px}
details[open]>.sum{margin-bottom:12px}

/* ---------- Controls ---------- */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;
  border:2px solid var(--ink);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.btn.icon{width:46px;padding:0;font-size:22px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.link{appearance:none;background:none;border:0;padding:10px 2px;color:var(--accent);font-weight:700;font-size:15px}
.link.danger{color:var(--danger)}
.link.quiet{color:var(--mute)}
.armed{background:var(--danger)!important;color:#fff!important;border-radius:8px;padding:10px 12px}
.input{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-weight:600;font-size:16px}
.input:focus{outline:none;border-color:var(--accent)}
textarea.input{padding:12px 14px;min-height:130px;resize:vertical;line-height:1.55}
select.input{appearance:none;-webkit-appearance:none;padding-right:38px;
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.field{display:flex;gap:8px}
.field .input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;min-height:36px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--ink);color:var(--on-accent)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:2px solid var(--ink);margin:0 0 16px}
.seg{overflow-x:auto}
.seg button{flex:1 0 auto;padding:0 10px;min-height:40px;border:0;border-radius:10px;background:none;color:var(--mute);font-weight:700;font-size:15px}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.check{appearance:none;width:46px;height:46px;flex:none;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--on-accent);transition:background .15s,border-color .15s}
.check svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.check[aria-pressed="true"] svg{opacity:1}

/* ---------- Workout ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:400 22px/1.15 "Dela Gothic One",sans-serif;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.tile{appearance:none;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--ink);background:var(--surface);box-shadow:3px 3px 0 var(--panel);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--panel)}
.tile b{display:block;font:400 19px/1.2 "Dela Gothic One",sans-serif}
.tile span{font-size:13px;color:var(--mute);font-weight:700}
.clock{font:400 40px/1.05 "Dela Gothic One",sans-serif;font-variant-numeric:tabular-nums;margin:2px 0}
.tags{color:var(--mute);font-size:14px;margin-top:2px}
.howto{margin:10px 0 4px}
.howto>summary{color:var(--accent);font-weight:700;font-size:14px;padding:4px 0}
.howto p{color:var(--mute);font-size:15px;margin-top:6px}
.set-row{display:grid;grid-template-columns:30px minmax(0,1fr) 74px 60px 46px;gap:8px;align-items:center;margin-top:8px}
.set-row.h{margin-top:14px;font-size:12px;font-weight:700;color:var(--mute)}
.set-row.h span:nth-child(n+3){text-align:center}
.sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:13px;font-weight:900;color:var(--mute)}
.prev{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num-in{width:100%;height:46px;border-radius:10px;border:2px solid transparent;background:var(--surface-2);text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.num-in:focus{outline:none;border-color:var(--accent)}
.set-row.done .num-in{background:var(--good-soft)}
.set-row.done .sn{background:var(--good);color:#fff}

/* ---------- Rest timer ---------- */
#rest{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);z-index:15;max-width:576px;margin:0 auto;
  background:var(--ink);color:var(--surface);border-radius:18px;padding:12px 14px 16px;box-shadow:4px 4px 0 var(--panel);display:flex;align-items:center;gap:12px;overflow:hidden}
#rest .lbl{display:block;font-size:12px;font-weight:700;opacity:.75}
#rest .t{display:block;font:400 30px/1 "Dela Gothic One",sans-serif;font-variant-numeric:tabular-nums;min-width:96px}
#rest .rb{display:flex;gap:6px;margin-left:auto}
#rest .rb button{border:0;border-radius:10px;min-height:40px;padding:0 12px;background:rgba(127,127,127,.28);color:inherit;font-weight:700;font-size:14px}
#rest .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(127,127,127,.3)}
#rest .bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform .25s linear}

/* ---------- Nav & toast ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:2px solid var(--ink);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav.tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border:0;background:none;color:var(--mute);font-weight:700;font-size:12px}
nav.tabs .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .15s}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .ic{background:var(--accent);color:var(--on-accent)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:30;transform:translate(-50%,-250%);max-width:calc(100% - 32px);
  background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;box-shadow:3px 3px 0 var(--panel);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
#toast.show{transform:translate(-50%,0)}

/* ---------- Diagrams & charts ---------- */
.figure{display:block;width:100%;max-width:300px;height:auto;margin:6px auto 0}
.figure .base{fill:var(--body);stroke:var(--line);stroke-width:1.2;stroke-linejoin:round}
.figure .m path{fill:var(--muscle);stroke:var(--body);stroke-width:1.1;stroke-linejoin:round;transition:fill .25s}
.figure .m.on path{fill:var(--accent)}
.figure text{fill:var(--mute);font:700 10px "Zen Maru Gothic",sans-serif}
.chart{display:block;width:100%;height:auto;margin-top:10px;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .last{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.chart text{fill:var(--mute);font:700 11px "Zen Maru Gothic",sans-serif}
.trend{margin-top:12px}
.trend b{font:400 28px/1.1 "Dela Gothic One",sans-serif;font-variant-numeric:tabular-nums}
.trend b small{font:700 15px "Zen Maru Gothic",sans-serif;color:var(--mute)}
.trend span{display:block;color:var(--mute);font-size:14px;font-weight:700}
.bars{display:flex;gap:6px;height:150px;margin-top:12px}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars .col span{font-size:11px;font-weight:700;margin-bottom:3px;font-variant-numeric:tabular-nums}
.bars .col i{display:block;width:100%;max-width:44px;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--accent),var(--accent-2))}
.bars em{font-style:normal;font-size:10px;color:var(--mute);text-align:center;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Lists ---------- */
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow>span:last-child{text-align:right;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.lrow small{display:block;font-size:12px}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.photos figure{margin:0}
.photos img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:2px solid var(--ink)}
.photos figcaption{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);font-weight:700}

/* ---------- Daily ---------- */
.sup{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row+.sup{border-top:0}
.sup>div{flex:1;min-width:0}
.dots{display:flex;gap:5px;margin-top:8px}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:900;color:var(--mute)}
.dot.on{background:var(--good);border-color:var(--good);color:#fff}
.dot.today{border-color:var(--ink)}
.moodstrip{display:flex;gap:4px;margin-top:12px}
.moodstrip span{flex:1;text-align:center;font-size:18px;line-height:30px;border-radius:8px;background:var(--surface-2)}
.moodstrip span.none{font-size:12px;color:var(--mute)}

/* ---------- Badges ---------- */
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:8px}
.badge{border:2px solid var(--ink);border-radius:14px;background:var(--surface);padding:14px 12px;text-align:center;box-shadow:3px 3px 0 var(--panel)}
.badge .em{font-size:34px;line-height:1.15}
.badge b{display:block;font-size:15px;margin-top:4px;line-height:1.25}
.badge span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.badge .meter{height:5px;margin-top:8px}
.badge.lock{border-color:var(--line);box-shadow:none;background:transparent}
.badge.lock .em{filter:grayscale(1);opacity:.4}

/* ---------- Settings ---------- */
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.swatch{appearance:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.swatch i{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink)}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:3px 3px 0 var(--panel)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.setrow select{width:auto;min-width:110px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---------- Hints, templates, plates ---------- */
.hint{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px}
.hint .txt{flex:1;color:var(--mute);line-height:1.4}
.hint .txt b{color:var(--ink)}
.hint.up{background:var(--good-soft)}
.hint.up .txt{color:var(--ink)}
.tile small{display:block;font-size:12px;color:var(--mute);margin-top:6px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-actions{display:flex;gap:14px;align-items:center}
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,6,25,.5)}
#sheet .panel{width:100%;max-width:600px;background:var(--surface);border-top:2px solid var(--ink);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:88vh;overflow:auto;cursor:default}
.plates-svg{display:block;width:100%;height:auto;margin:16px 0 8px}
/* ---------- Modes & Japan ---------- */
.modes{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto}
.modes button{font-size:14px}
.modes button:not([aria-selected="true"]){padding:0 10px;font-size:18px}
.modes{gap:6px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.modes button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--mute);font-weight:700;font-size:14px}
.modes button[aria-selected="true"]{border-color:var(--ink);background:var(--accent);color:var(--on-accent)}
.stack>*+*{margin-top:10px}

.ev-a{display:flex;flex-direction:column;align-items:flex-end}
.ev-a .link{padding:2px 0;font-size:14px}
.ev.auto .ev-b>b{color:var(--mute)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pair>div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.pair span{display:block;font-size:12px;color:var(--mute);font-weight:700}
.pair b{font-size:15px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--good);color:#fff;font-size:12px;font-weight:700;vertical-align:middle}
.cbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}

.pad button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--panel)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}

<body>
<main id="app"></main>

<div id="rest" hidden role="timer">
  <div><span class="lbl">Rest</span><span class="t" id="restTime">0:00</span></div>
  <div class="rb"><button data-act="restMinus" aria-label="Remove 15 seconds">−15s</button><button data-act="restPlus" aria-label="Add 15 seconds">+15s</button><button data-act="restSkip">Skip</button></div>
  <div class="bar"><i id="restBar"></i></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheetRoot"></div>
<div id="lockRoot"></div>

<nav class="tabs" aria-label="Sections" id="nav"></nav>

<script>
'use strict';
/* =========================================================
   Constants and reference data
   ========================================================= */
const KEY = 'liftlog:v1';
const MUSCLES = ['Chest','Back','Shoulders','Biceps','Triceps','Forearms','Core','Obliques','Traps','Lower Back','Glutes','Quads','Hamstrings','Calves'];
const DEFAULT_CATS = [['upper','Upper'],['lower','Lower'],['push','Push'],['pull','Pull'],['legs','Legs']];

// name | categories | muscles | how-to
const SEED = `Bench Press|upper push|Chest,Triceps,Shoulders|Lie flat, grip just outside shoulders, lower the bar to mid-chest, press up. Feet planted, shoulder blades pinched.
Incline Dumbbell Press|upper push|Chest,Shoulders,Triceps|Bench at 30 degrees. Lower the dumbbells to your upper chest, press up, keep elbows about 45 degrees from your body.
Cable Fly|upper push|Chest|Slight elbow bend, bring the handles together in front of your chest, squeeze, open slowly.
Overhead Press|upper push|Shoulders,Triceps|Bar at collarbone, squeeze glutes, press straight up and move your head through at the top.
Lateral Raise|upper push|Shoulders|Slight elbow bend, raise arms out to shoulder height, lower slowly. No swinging.
Triceps Pushdown|upper push|Triceps|Elbows pinned at your sides, push the cable down until arms are straight, control the return.
Dips|upper push|Chest,Triceps|Lean forward slightly, lower until shoulders are just below elbows, press back up.
Pull-Up|upper pull|Back,Biceps|Hang from the bar, pull your chest toward it by driving elbows down, lower fully.
Barbell Row|upper pull|Back,Biceps,Lower Back|Hinge to about 45 degrees with a flat back, pull the bar to your lower ribs, squeeze, lower slowly.
Lat Pulldown|upper pull|Back,Biceps|Chest tall, pull the bar to your upper chest with elbows down and back, return slowly.
Seated Cable Row|upper pull|Back,Biceps|Sit tall, pull the handle to your stomach, squeeze shoulder blades, don't rock.
Face Pull|upper pull|Shoulders,Back,Traps|Rope at face height, pull toward your face with elbows high, rotate hands outward.
Shrug|upper pull|Traps|Hold the weight at your sides, lift your shoulders straight up toward your ears, pause, lower slowly.
Biceps Curl|upper pull|Biceps,Forearms|Elbows at your sides, curl up without swinging, lower for 2 seconds.
Hammer Curl|upper pull|Biceps,Forearms|Palms facing in, curl the dumbbells up, keep elbows still.
Plank|upper lower|Core,Obliques|Forearms down, body in a straight line, brace your abs, breathe steadily.
Cable Crunch|upper|Core|Kneel facing the cable, hold the rope by your head, crunch your ribs toward your hips, return slowly.
Russian Twist|lower|Obliques,Core|Sit leaning back with feet up or down, rotate your torso side to side with control.
Squat|lower legs|Quads,Glutes,Core|Bar on upper back, feet shoulder-width, sit down between your hips, knees track toes, drive up.
Romanian Deadlift|lower legs|Hamstrings,Glutes,Lower Back|Soft knees, push hips back with the bar close to your legs until hamstrings stretch, stand tall.
Deadlift|lower pull|Back,Hamstrings,Glutes,Lower Back|Bar over mid-foot, flat back, push the floor away, lock out hips, lower with control.
Back Extension|lower pull|Lower Back,Glutes,Hamstrings|Hips on the pad, lower your torso with a flat back, rise until your body is straight. Don't overarch.
Leg Press|lower legs|Quads,Glutes|Feet shoulder-width, lower until knees are about 90 degrees, press without locking out.
Walking Lunge|lower legs|Quads,Glutes|Take a long step, drop the back knee toward the floor, push through the front heel.
Leg Curl|lower legs|Hamstrings|Hips pinned, curl heels toward glutes, pause, return slowly.
Leg Extension|lower legs|Quads|Sit back, extend until legs are straight, squeeze quads, lower slowly.
Hip Thrust|lower legs|Glutes,Hamstrings|Upper back on a bench, bar over hips, drive up until hips are level, squeeze.
Calf Raise|lower legs|Calves|Rise onto your toes as high as you can, pause, lower to a full stretch.`;

const STRETCHES = `Chest|Doorway stretch|Forearm on a door frame, elbow at shoulder height, step through until you feel it across your chest. 30 seconds a side.
Back|Child's pose|Kneel, sit your hips back, reach your arms forward on the floor and breathe. 30 to 45 seconds.
Shoulders|Cross-body stretch|Pull one arm across your chest with the other hand. 30 seconds a side.
Biceps|Wall biceps stretch|Palm flat on a wall behind you, fingers pointing back, turn your body away gently. 30 seconds a side.
Triceps|Overhead triceps stretch|Reach one hand down your back and press that elbow back with the other hand. 30 seconds a side.
Forearms|Wrist flexor stretch|Arm out, palm up, gently pull your fingers back with the other hand. 20 to 30 seconds a side.
Core|Cobra stretch|Lie face down, press up through your hands, keep your hips on the floor. 20 to 30 seconds.
Obliques|Standing side bend|Reach one arm overhead and lean to the opposite side. 20 to 30 seconds a side.
Traps|Neck and upper trap stretch|Tilt your ear toward your shoulder and let the weight of your head do the work. 20 to 30 seconds a side.
Lower Back|Knees-to-chest stretch|Lie on your back and hug both knees toward your chest. 20 to 30 seconds.
Glutes|Figure-four stretch|Lying down, cross an ankle over the opposite knee and pull that knee toward your chest. 30 seconds a side.
Quads|Standing quad stretch|Pull your heel toward your glute, knees together, stand tall. 30 seconds a side.
Hamstrings|Seated forward fold|Legs straight, hinge from the hips toward your toes with a flat back. 30 to 45 seconds.
Calves|Wall calf stretch|Hands on a wall, back heel down and leg straight, lean in. 30 seconds a side.`.split('\n').map(l => l.split('|'));

const MOODS = [['😞','Rough'],['😕','Meh'],['😐','Okay'],['🙂','Good'],['😄','Great']];
const THEMES = [
  ['sakura','Sakura','#F0467F','#2BB8D0'],['midnight','Midnight','#8B6CFF','#141B2D'],['ocean','Ocean','#0A86AA','#F2A541'],
  ['forest','Forest','#86D993','#1F2B22'],['sunset','Sunset','#E8590C','#B5179E'],['mono','Mono','#141414','#F3F3F1']];

const TAB_INFO = {
  workout:{g:'workout',t:'Workout'},
  catalog:{g:'library',t:'Exercises'}, care:{g:'library',t:'Stretching'},
  history:{g:'progress',t:'Lifts'}, body:{g:'progress',t:'Body'}, badges:{g:'progress',t:'Badges'},
  today:{g:'daily',t:'Supplements'}, journal:{g:'daily',t:'Journal'},
  settings:{g:'settings',t:'Settings'}};
const GROUPS = {workout:['workout'],library:['catalog','care'],progress:['history','body','badges'],daily:['today','journal'],settings:['settings']};

const ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* =========================================================
   Utilities
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => parseFloat(v) || 0;
const norm = s => String(s).trim().toLowerCase();
const pad = n => String(n).padStart(2, '0');
const dk = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dk(new Date());
const keyDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtMD = d => d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
const fmtLong = t => new Date(t).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
const fmtN = v => { const r = Math.round(v * 10) / 10; return r.toLocaleString(); };
const short = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'k' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n));
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const daysBack = n => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - n); return d; };
const toggleIn = (arr, v) => { const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); };
function clock(ms, roundUp) {
  let s = Math.max(0, roundUp ? Math.ceil(ms / 1000) : Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); s %= 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
const weekStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };
const chip = (text, on, attrs) => `<button class="chip${on ? ' on' : ''}" aria-pressed="${!!on}" ${attrs}>${esc(text)}</button>`;

/* =========================================================
   State: load, normalize, save
   ========================================================= */
function seedExercises() {
  return SEED.split('\n').map((l, i) => {
    const [name, cats, muscles, how] = l.split('|');
    return {id:'s' + i, name, cats:cats.split(' '), muscles:muscles.split(','), how};
  });
}
function blank() {
  return {unit:'lb', rest:90, wg:8, theme:'sakura', tab:'workout', last:{}, history:[], active:null, timer:null,
    cats:null, ex:null, bw:[], j:[], sup:null, sl:{}, wt:{}, st:{}, sp:{}, bd:{}, cf:'all', cm:'all', pick:null, lb:0, tpl:[], rr:'6-10', inc:null, bar:null};
}
function normalize(s) {
  if (!Array.isArray(s.history)) s.history = [];
  if (!Array.isArray(s.cats)) s.cats = DEFAULT_CATS.map(([id, name]) => ({id, name}));
  if (!Array.isArray(s.ex)) s.ex = seedExercises();
  s.ex.forEach(e => { if (!Array.isArray(e.cats)) e.cats = []; if (!Array.isArray(e.muscles)) e.muscles = []; if (!e.how) e.how = 'No notes yet.'; });
  if (!Array.isArray(s.sup)) s.sup = [{id:'creatine', name:'Creatine', dose:''}, {id:'omega3', name:'Omega-3', dose:''}];
  for (const k of ['bw', 'j', 'tpl']) if (!Array.isArray(s[k])) s[k] = [];
  if (!/^\d+-\d+$/.test(s.rr || '')) s.rr = '6-10';
  if (typeof s.bar !== 'number') s.bar = null; if (typeof s.inc !== 'number') s.inc = null;
  for (const k of ['sl', 'wt', 'st', 'sp', 'bd', 'last']) if (!s[k] || typeof s[k] !== 'object' || Array.isArray(s[k])) s[k] = {};
  if (s.active && !Array.isArray(s.active.muscles)) s.active.muscles = [];
  if (s.tab === 'nutrition') s.tab = 'today';
  if (!TAB_INFO[s.tab]) s.tab = 'workout';
  if (!THEMES.some(t => t[0] === s.theme)) s.theme = 'sakura';
  normalizeJp(s);
  normalizeMd(s);
  normalizeSv(s);
  normalizeExtra(s);
  return s;
}
function load() {
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  return normalize(Object.assign(blank(), data));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* =========================================================
   Modes (Gym, Japan) and their bottom tabs
   ========================================================= */
const ICON = {
  workout:'<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
  library:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19"/>',
  progress:'<path d="M3 20h18M6 16l4-5 3 3 5-7"/>',
  daily:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/>',
  settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  plan:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  money:'<path d="M7 4l5 7 5-7M12 11v9M8 13h8M8 16.5h8"/>',
  book:'<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M14 8v1.5M14 11.3v1.4M14 14.5V16"/>',
  lists:'<path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6l1.2 1.2L7.5 5M4 12l1.2 1.2L7.5 11M4 18l1.2 1.2L7.5 17"/>'};
const MODES = {
  gym:{label:'Gym', em:'🏋️', nav:[['workout','Workout','workout'],['library','Library','library'],['progress','Progress','progress'],['daily','Daily','daily'],['settings','Settings','settings']]},
  japan:{label:'Japan', em:'🗾', nav:[['jplan','Plan','plan'],['jmoney','Money','money'],['jbook','Bookings','book'],['jlists','Lists','lists'],['settings','Settings','settings']]}};
Object.assign(TAB_INFO, {
  jplan:{g:'jplan',t:'Itinerary'}, jprep:{g:'jplan',t:'To-do'}, jjournal:{g:'jplan',t:'Journal'}, jgifts:{g:'jlists',t:'Gifts'}, jmoney:{g:'jmoney',t:'Budget'}, jconv:{g:'jmoney',t:'Converter'},
  jflights:{g:'jbook',t:'Flights'}, jstays:{g:'jbook',t:'Stays'},
  jpack:{g:'jlists',t:'Packing'}, jplaces:{g:'jlists',t:'Places'}, jphrases:{g:'jlists',t:'Phrases'}, jinfo:{g:'jlists',t:'Info'}});
Object.assign(GROUPS, {jplan:['jplan','jprep','jjournal'], jmoney:['jmoney','jconv'], jbook:['jflights','jstays'], jlists:['jpack','jplaces','jgifts','jphrases','jinfo']});
const firstTab = mode => GROUPS[MODES[mode].nav[0][0]][0];
const modeOfGroup = g => Object.keys(MODES).find(m => m !== 'gym' && MODES[m].nav.some(n => n[0] === g && g !== 'settings')) || 'gym';
const modeBar = () => `<div class="modes" role="tablist" aria-label="Mode">${orderedModes().filter(k => modeVisible(k)).map(k => [k, MODES[k]]).map(([k, m]) =>
  `<button role="tab" aria-selected="${S.mode === k}" data-act="mode" data-k="${k}" title="${m.label}"><span aria-hidden="true">${m.em}</span>${S.mode === k ? m.label : `<span class="vh">${m.label}</span>`}</button>`).join('')}</div>`;

/* =========================================================
   Japan: data
   ========================================================= */
const JP_PACK = `Documents|Passport
Documents|Flight confirmations
Documents|Stay confirmations and addresses
Documents|Travel insurance info
Money|Credit card with no foreign transaction fee
Money|Debit card for ATM cash
Money|Some yen cash for arrival
Tech|Phone and charger
Tech|Power bank
Tech|eSIM or pocket Wi-Fi set up
Tech|Headphones
Clothes|Winter coat
Clothes|Warm layers
Clothes|Comfortable walking shoes
Clothes|Good socks (you take your shoes off a lot)
Toiletries|Toothbrush and toiletries
Toiletries|Medications in original packaging
Other|Small towel or handkerchief
Other|Coin pouch
Other|Reusable bag
Other|Empty space for souvenirs`;
function jpDefaults() {
  return {start:'2027-01-12', end:'2027-02-02', budget:0, rate:{v:158.13, d:'2026-10-20', src:'ecb'},
    items:[], exp:[], flights:[], stays:[], places:[], notes:'', sel:null, gifts:[], journal:{}, jsel:null, prep:prepSeed(),
    pack:JP_PACK.split('\n').map((l, i) => { const [cat, t] = l.split('|'); return {id:'k' + i, cat, t, done:false}; })};
}
function normalizeJp(s) {
  const d = jpDefaults();
  if (!s.jp || typeof s.jp !== 'object') s.jp = d;
  for (const k in d) if (s.jp[k] == null) s.jp[k] = d[k];
  for (const k of ['items', 'exp', 'flights', 'stays', 'places', 'pack', 'prep', 'gifts']) if (!Array.isArray(s.jp[k])) s.jp[k] = d[k];
  if (typeof s.jp.journal !== 'object' || Array.isArray(s.jp.journal)) s.jp.journal = {};
  if (!s.jp.rate || !(s.jp.rate.v > 0)) s.jp.rate = d.rate;
  if (!MODES[s.mode]) s.mode = 'gym';
  if (!s.lastMode || typeof s.lastMode !== 'object') s.lastMode = {};
  const g = TAB_INFO[s.tab].g;
  if (g !== 'settings' && !MODES[s.mode].nav.some(n => n[0] === g)) s.tab = firstTab(s.mode);

function icsFile() {
  const J = S.jp, stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';

  const d8 = k => k.replace(/-/g, '');

    const lines = ['BEGIN:VEVENT', `UID:${uid}@hibi`, `DTSTAMP:${stamp}`];
    if (time) { const [h, m] = time.split(':').map(Number), end = Math.min(h + 1, 23); lines.push(`DTSTART;TZID=Asia/Tokyo:${d8(k)}T${pad(h)}${pad(m)}00`, `DTEND;TZID=Asia/Tokyo:${d8(k)}T${pad(end)}${pad(end === h + 1 ? m : 59)}00`); }
    else { const n = keyDate(k); n.setDate(n.getDate() + 1); lines.push(`DTSTART;VALUE=DATE:${d8(k)}`, `DTEND;VALUE=DATE:${d8(dk(n))}`); }
    lines.push(`SUMMARY:${escI(title)}`); if (place) lines.push(`LOCATION:${escI(place)}`); if (note) lines.push(`DESCRIPTION:${escI(note)}`);

  return {count:ev.length, text:['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Hibi//Japan trip//EN', 'CALSCALE:GREGORIAN', tz, ...ev, 'END:VCALENDAR'].join('\r\n')};

function alType(m) {

async function mdSearch(q, type) {

      year:s.premiered ? s.premiered.slice(0, 4) : '', platform:(s.network && s.network.name) || (s.webChannel && s.webChannel.name) || '', src:'tvmaze:' + s.id}));
  }
  if (type === 'book') {
    const d = await (await fetch('https://openlibrary.org/search.json?limit=8&fields=key,title,author_name,cover_i,number_of_pages_median,first_publish_year&q=' + encodeURIComponent(q))).json();
    return (d.docs || []).map(b => ({title:b.title, alt:(b.author_name || []).slice(0, 2).join(', '), type:'book', total:b.number_of_pages_median || 0, unit:'page',

  }

    body:JSON.stringify({query:ALQ, variables:{s:q, t:(type === 'anime' || type === 'movie') ? 'ANIME' : 'MANGA'}})});
  const d = await r.json();
  return ((d.data && d.data.Page && d.data.Page.media) || []).map(m => {
    const t = alType(m), watch = t === 'anime' || t === 'movie';
    return {title:m.title.english || m.title.romaji, alt:m.title.english && m.title.romaji !== m.title.english ? m.title.romaji : '', type:t,
      total:(t === 'ln' ? m.volumes : watch ? m.episodes : m.chapters) || 0, unit:t === 'ln' ? 'vol' : watch ? 'ep' : 'ch',
      img:(m.coverImage && (m.coverImage.large || m.coverImage.medium)) || '', year:m.startDate && m.startDate.year, src:'anilist:' + m.id};
  });
}

/* ----- Savings extras: payday split, dream amount, Japan link ----- */
function svPer(g) {
  const left = Math.max(0, num(g.target) - svSaved(g)); if (!left || !g.date) return 0;
  const dd = (keyDate(g.date) - keyDate(today())) / 864e5; if (dd <= 0) return left;
  return left / Math.max(1, Math.ceil(dd / SV_FREQ[S.sv.freq][0]));
}
function payAlloc(total) {
  const act = S.sv.goals.filter(g => !svDone(g) || num(g.dream) > svSaved(g));
  if (!act.length || !(total > 0)) return {out:[], rest:total || 0};
  const cap = g => Math.max(0, (num(g.dream) > num(g.target) ? num(g.dream) : num(g.target) || Infinity) - svSaved(g));
  const amt = new Map(act.map(g => [g, 0])), r2 = x => Math.floor(x * 100) / 100;
  let rem = total;
  if (act.some(g => num(g.pct) > 0)) {
    const sum = act.reduce((a, g) => a + num(g.pct), 0);
    act.forEach(g => { const x = Math.min(cap(g), r2(total * num(g.pct) / sum)); amt.set(g, x); rem -= x; });
  } else {
    act.filter(g => g.date).forEach(g => { const x = Math.min(cap(g), r2(svPer(g)), r2(rem)); amt.set(g, x); rem -= x; });
    for (let pass = 0; pass < 3 && rem > 0.009; pass++) {
      const open = act.filter(g => amt.get(g) < cap(g) - 0.009 && (pass > 0 || !g.date));
      const pool = open.length ? open : act.filter(g => amt.get(g) < cap(g) - 0.009);
      if (!pool.length) break;
      const each = r2(rem / pool.length);
      if (each <= 0) break;
      pool.forEach(g => { const x = Math.min(cap(g) - amt.get(g), each); amt.set(g, r2(amt.get(g) + x)); rem -= x; });
    }
  }
  const out = act.map(g => ({g, amt:amt.get(g)})).filter(o => o.amt > 0);
  return {out, rest:Math.round((total - out.reduce((a, o) => a + o.amt, 0)) * 100) / 100};
}
function payPreview(a) {
  if (!(a > 0)) return '';
  const {out, rest} = payAlloc(a);
  if (!out.length) return '<p class="note">No active goals to put it in.</p>';
  return out.map(o => `<div class="lrow"><span style="text-align:left;color:var(--ink)">${esc(o.g.em || '💰')} ${esc(o.g.name)}</span><b>${usd(o.amt)}</b></div>`).join('') + (rest > 0.009 ? `<p class="note">${usd(rest)} won't fit, because those goals would be full.</p>` : '');
}
function jpSaved() {
  const gs = S.sv.goals.filter(g => g.jp); if (!gs.length) return '';
  const s = gs.reduce((a, g) => a + svSaved(g), 0), B = num(S.jp.budget);
  return `<p class="note">💰 You've saved <b>${usd(s)}</b> for this trip in Savings${B ? `, ${Math.round(s / B * 100)}% of your budget` : ''}.</p>`;
}

async function hashPin(p) {

}
function lockHtml() {
  if (!locked && !PINF) return '';

  return `<div id="lock" role="dialog" aria-modal="true" aria-label="${title}"><div class="lk"><div class="lk-em" aria-hidden="true">🔒</div><h2>${title}</h2>
    <div class="dots4" aria-hidden="true">${[0, 1, 2, 3].map(i => `<i class="${i < pinBuf.length ? 'on' : ''}"></i>`).join('')}</div>
    <p class="small" id="lockMsg" role="alert" style="min-height:22px;color:var(--danger);font-weight:700"></p>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button data-pin="${k}" aria-label="${k === '⌫' ? 'Delete' : k}">${k}</button>`).join('')}</div>
    ${PINF ? '<button class="link" data-pin="cancel">Cancel</button>' : ''}</div></div>`;
}
function drawLock(msg) { $('#lockRoot').innerHTML = lockHtml(); if (msg && $('#lockMsg')) $('#lockMsg').textContent = msg; }
async function pinKey(k) {
  if (k === 'cancel') { PINF = null; pinBuf = ''; drawLock(); return; }
  if (k === '⌫') { pinBuf = pinBuf.slice(0, -1); drawLock(); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += k; drawLock(); if (pinBuf.length < 4) return;
  const entered = pinBuf; pinBuf = '';
  const bad = m => { drawLock(m); try { navigator.vibrate && navigator.vibrate(150); } catch (e) {} };
  if (locked) { if (await hashPin(entered) === S.pin) { locked = false; drawLock(); } else bad('Wrong passcode. Try again.'); return; }
  if (PINF.step === 'current') {
    if (await hashPin(entered) !== S.pin) return bad("That isn't your current passcode.");

function lineChart(pts, unit) {

  const W = 320, H = 150, T = 14, B = 22, n = pts.length, vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pd = (hi - lo) * .15; lo -= pd; hi += pd;
  const X = i => 6 + i * (W - 12) / (n - 1), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B), base = H - B;
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const id = 'lg' + (++gradId);
  const grid = [T, (T + base) / 2, base].map(y => `<line class="grid" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`).join('');
  const dots = n <= 24 ? pts.slice(0, -1).map((p, i) => `<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5"/>`).join('') : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend from ${esc(pts[0].l)} to ${esc(pts[n - 1].l)}: ${fmtN(vs[0])} to ${fmtN(vs[n - 1])} ${esc(unit)}">

function render() {
  const g = TAB_INFO[S.tab].g, tabs = GROUPS[g];

  $('#app').innerHTML = `${updateBanner()}${modeBar()}<header class="top"><h1>${TAB_INFO[S.tab].t}</h1><p>${esc(subtitle())}</p></header>${seg}${(VIEWS[S.tab] || JVIEWS[S.tab] || MVIEWS[S.tab] || SVIEWS[S.tab] || XVIEWS[S.tab])()}`;
  $('#sheetRoot').innerHTML = sheetHtml();
  { const mb = $('.modes'), sel = mb && mb.querySelector('[aria-selected="true"]'); if (sel && (sel.offsetLeft + sel.offsetWidth > mb.clientWidth + mb.scrollLeft || sel.offsetLeft < mb.scrollLeft)) mb.scrollLeft = Math.max(0, sel.offsetLeft - 16); }
  $('#nav').innerHTML = MODES[S.mode].nav.map(([ng, label, ic]) => `<button data-nav="${ng}"${ng === g ? ' aria-current="page"' : ''}><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[ic]}</svg></span>${label}</button>`).join('');

function go(tab) {
  if (!TAB_INFO[tab]) return;
  S.tab = tab; S.last[TAB_INFO[tab].g] = tab;
}

/* =========================================================
   Feedback: toast, sound
   ========================================================= */
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
let audio;
function unlockAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {} }
function beep() {
  try {
    unlockAudio();
    [0, .22].forEach(off => {
      const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + off;
      o.connect(g); g.connect(audio.destination); o.frequency.value = 880;
      g.gain.setValueAtTime(.25, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .18); o.start(t0); o.stop(t0 + .2);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
}

/* =========================================================
   Timers
   ========================================================= */
function startRest() { S.timer = {end:Date.now() + S.rest * 1000, total:S.rest}; }
function tick() {
  const jc = $('#jpClock'); if (jc) jc.textContent = tokyoNow();
  const el = $('#elapsed'); if (el && S.active) el.textContent = clock(Date.now() - S.active.start);
  const r = $('#rest');
  if (!S.timer) { r.hidden = true; return; }
  const left = S.timer.end - Date.now();
  if (left <= 0) {
    const stale = left < -60000;
    S.timer = null; save(); r.hidden = true;
    if (!stale) { beep(); toast('Rest is over. Next set!'); }
    return;
  }
  r.hidden = false;
  $('#restTime').textContent = clock(left, true);
  $('#restBar').style.transform = `scaleX(${Math.max(0, Math.min(1, left / (S.timer.total * 1000)))})`;
}

/* =========================================================
   Actions (each mutates state; returning false skips save/render)
   ========================================================= */
function addSetTo(ex) {
  const last = ex.sets[ex.sets.length - 1], p = prevFor(ex.name, ex.sets.length);
  ex.sets.push({w:p ? p.w : last ? last.w : '', r:p ? p.r : last ? last.r : '', done:false});
}
function addExercise(name) {
  const a = S.active, p = prevFor(name, 0), info = exInfo(name);
  a.exercises.push({name:info ? info.name : name, sets:[{w:p ? p.w : '', r:p ? p.r : '', done:false}]});
  if (info) info.muscles.forEach(m => { if (!a.muscles.includes(m)) a.muscles.push(m); });
}
const ACT = {
  go: d => go(d.to),
  start: d => { S.active = {id:Date.now(), start:Date.now(), cat:d.cat || null, muscles:[], exercises:[]}; UI.open.sessionMuscles = false; },
  addFromLib: d => { const e = S.ex.find(x => x.id === d.id); if (!e) return false; addExercise(e.name); },
  addTyped: () => { const v = $('#newEx').value.trim(); if (!v) { toast('Type an exercise name first.'); return false; } addExercise(v); },
  removeEx: d => { S.active.exercises.splice(+d.x, 1); },
  addSet: d => addSetTo(S.active.exercises[+d.x]),
  removeSet: d => { const ex = S.active.exercises[+d.x]; if (ex.sets.length > 1) ex.sets.pop(); },
  toggleSet: d => {
    const ex = S.active.exercises[+d.x], s = ex.sets[+d.s];
    s.done = !s.done;
    if (s.done) { const p = prevFor(ex.name, +d.s); if (s.w === '' && p) s.w = p.w; if (s.r === '' && p) s.r = p.r; startRest(); }
  },
  sessionMuscle: d => toggleIn(S.active.muscles, d.m),
  finish: () => {
    const a = S.active;
    const ex = a.exercises.map(e => ({name:e.name, sets:e.sets.filter(s => s.done).map(s => ({w:s.w, r:s.r}))})).filter(e => e.sets.length);
    if (!ex.length) { toast('Check off at least one set to save this workout.'); return false; }
    const prs = ex.filter(e => { const old = series(e.name); return old.length && topOf(e) > Math.max(...old.map(p => p.v)); }).map(e => e.name);
    S.history.push({id:a.id, start:a.start, end:Date.now(), cat:a.cat, tpl:a.tpl || null, muscles:a.muscles, exercises:ex});
    if (a.tpl && S.tpl.some(t => t.id === a.tpl)) S.next = tplAfter(a.tpl);
    S.active = null; S.timer = null;
    toast(prs.length ? `🏆 New PR: ${prs.join(', ')}!` : `Workout saved. ${plural(ex.reduce((t, e) => t + e.sets.length, 0), 'set')} logged.`);
  },
  discard: () => { S.active = null; S.timer = null; },
  restMinus: () => { if (!S.timer) return false; S.timer.end -= 15000; S.timer.total = Math.max(15, S.timer.total - 15); },
  restPlus: () => { if (!S.timer) return false; S.timer.end += 15000; S.timer.total += 15; },
  restSkip: () => { S.timer = null; },
  applyHint: d => {
    const ex = S.active.exercises[+d.x], h = hintFor(ex.name); if (!h) return false;
    ex.sets.forEach(s => { if (!s.done) { s.w = String(h.w); s.r = String(h.r); } });
    toast(`Sets filled in: ${fmtN(h.w)} ${S.unit} × ${h.r}.`);
  },

  saveTpl: () => {
    const a = S.active; if (!a.exercises.length) { toast('Add some exercises first.'); return false; }
    const name = ($('#tplName').value || '').trim() || (a.cat ? catName(a.cat) : 'My workout');
    const items = a.exercises.map(e => ({name:e.name, sets:Math.max(1, e.sets.length)}));
    let t = S.tpl.find(x => norm(x.name) === norm(name));
    if (t) { t.items = items; t.cat = a.cat || null; toast(`Updated ${name}.`); }
    else { t = {id:'t' + Date.now(), name, cat:a.cat || null, items}; S.tpl.push(t); toast(`Saved ${name} as a template.`); }
    a.tpl = t.id; UI.open.saveTpl = false;
  },
  tplFromWorkout: d => {
    const w = S.history.find(x => String(x.id) === d.id); if (!w) return false;
    const name = (w.cat ? catName(w.cat) : 'Workout') + ' ' + fmtMD(new Date(w.end));
    S.tpl.push({id:'t' + Date.now(), name, cat:w.cat || null, items:w.exercises.map(e => ({name:e.name, sets:e.sets.length}))});
    toast(`Saved as ${name}. Rename it on the Workout tab.`);
  },
  startTpl: d => {
    const t = S.tpl.find(x => x.id === d.id); if (!t) return false;
    S.active = {id:Date.now(), start:Date.now(), cat:t.cat || null, tpl:t.id, muscles:[], exercises:[]};
    UI.open.sessionMuscles = false;
    t.items.forEach(it => { addExercise(it.name); const ex = S.active.exercises[S.active.exercises.length - 1]; for (let i = 1; i < it.sets; i++) addSetTo(ex); });
  },
  deleteTpl: d => { S.tpl = S.tpl.filter(t => t.id !== d.id); if (S.next === d.id) S.next = null; },
  tplUp: d => { const i = S.tpl.findIndex(t => t.id === d.id); if (i > 0) [S.tpl[i - 1], S.tpl[i]] = [S.tpl[i], S.tpl[i - 1]]; },
  skipRot: () => { const t = nextTpl(); if (t) S.next = tplAfter(t.id); },

  openPlates: () => { UI.plates = {w:''}; },
  plates: d => { const ex = S.active.exercises[+d.x], s = ex.sets.find(x => !x.done) || ex.sets[ex.sets.length - 1]; UI.plates = {w:s ? s.w : ''}; },
  plateQuick: d => { UI.plates.w = d.w; },
  closeSheet: () => { UI.plates = null; },
  noop: () => false,

  filterCat: d => { S.cf = d.c; },
  exMuscle: d => { const e = S.ex.find(x => x.id === d.id); if (e) toggleIn(e.muscles, d.m); },
  exCat: d => { const e = S.ex.find(x => x.id === d.id); if (e) toggleIn(e.cats, d.c); },
  deleteEx: d => { S.ex = S.ex.filter(e => e.id !== d.id); },
  nfMuscle: d => toggleIn(NF.muscles, d.m),
  nfCat: d => toggleIn(NF.cats, d.c),
  createEx: () => {
    const name = NF.name.trim();
    if (!name) { toast('Give the exercise a name.'); return false; }
    if (exInfo(name)) { toast('That exercise is already in your library.'); return false; }
    S.ex.push({id:'u' + Date.now(), name, cats:NF.cats, muscles:NF.muscles, how:NF.how.trim() || 'No notes yet.'});
    NF = {name:'', how:'', muscles:[], cats:[]}; UI.open.newEx = false; toast(`Added ${name} to your library.`);
  },
  addCat: () => { const v = $('#newCat').value.trim(); if (!v) return false; S.cats.push({id:'c' + Date.now(), name:v}); },
  deleteCat: d => { S.cats = S.cats.filter(c => c.id !== d.c); S.ex.forEach(e => { e.cats = e.cats.filter(c => c !== d.c); }); if (S.cf === d.c) S.cf = 'all'; },
  filterCare: d => { S.cm = d.m; },

  deleteWorkout: d => { S.history = S.history.filter(w => String(w.id) !== d.id); },
  saveWeight: () => {
    const v = num($('#bwIn').value); if (!(v > 0)) { toast('Enter your weight first.'); return false; }
    S.bw = S.bw.filter(p => p.d !== today()); S.bw.push({d:today(), v}); S.bw.sort((a, b) => a.d < b.d ? -1 : 1); toast('Weight saved.');
  },
  deletePhoto: d => { pDel(+d.id).then(loadPhotos); return false; },

  toggleSup: d => { const k = today(); S.sl[k] = S.sl[k] || []; toggleIn(S.sl[k], d.id); },
  addSup: () => {
    if (!NS.name.trim()) { toast('Give the supplement a name.'); return false; }
    S.sup.push({id:'p' + Date.now(), name:NS.name.trim(), dose:NS.dose.trim()}); NS = {name:'', dose:''};
  },
  removeSup: d => { S.sup = S.sup.filter(x => x.id !== d.id); },
  mood: d => { JD.m = JD.m === +d.m ? 0 : +d.m; },
  saveJournal: () => {
    if (!JD.m && !JD.t.trim()) { toast('Pick a mood or write a few words first.'); return false; }
    S.j = S.j.filter(e => e.d !== JD.d); S.j.push({d:JD.d, m:JD.m, t:JD.t}); S.j.sort((a, b) => a.d < b.d ? -1 : 1); toast('Entry saved.');
  },
  deleteEntry: d => { S.j = S.j.filter(e => e.d !== d.d); if (d.d === today()) JD = null; },

  theme: d => { S.theme = d.k; applyTheme(); },
  shareBackup: () => {
    const file = new File([JSON.stringify(backup())], `hibi-backup-${today()}.json`, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      navigator.share({files:[file]}).then(() => { S.lb = Date.now(); save(); render(); toast('Backup saved.'); })
        .catch(e => { if (e.name !== 'AbortError') downloadBackup(file); });
    } else downloadBackup(file);
    return false;
  },
  copyBackup: () => {
    const t = $('#bk'); t.value = JSON.stringify(backup()); t.select();
    S.lb = Date.now(); save();
    try { navigator.clipboard.writeText(t.value).then(() => toast('Backup copied.'), () => toast('Select the text and copy it.')); } catch (e) { toast('Select the text and copy it.'); }
    return false;
  },
  restoreText: () => { restoreFrom($('#bk').value); return false; },
};
function downloadBackup(file) {
  let framed = true; try { framed = window.top !== window; } catch (e) {}
  if (framed) {
    UI.open.textBackup = true; render();
    const t = $('#bk'); t.value = JSON.stringify(backup()); t.select();
    toast('Files are blocked in this preview. Copy the text below instead.'); return;
  }
  try {
    const url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    S.lb = Date.now(); save(); render(); toast('Backup downloaded.');
  } catch (e) { toast('Saving a file is blocked here. Use copy as text instead.'); }
}

/* =========================================================
   Backup, restore and Hevy import
   ========================================================= */
const BACKUP_KEYS = ['unit','rest','wg','theme','cats','ex','history','bw','j','sup','sl','wt','st','sp','bd','tpl','rr','inc','bar','next','jp','md','sv','sc','hidden','order'];
function backup() { const o = {app:'hibi', version:2}; BACKUP_KEYS.forEach(k => o[k] = S[k]); return o; }
function restoreFrom(text) {
  let d;
  try { d = JSON.parse(text); if (!d || !Array.isArray(d.history)) throw 0; } catch (e) { toast('That is not a Hibi backup.'); return; }
  const have = new Set(S.history.map(w => w.id)); let added = 0;
  d.history.forEach(w => { if (!have.has(w.id)) { S.history.push(w); added++; } });
  S.history.sort((a, b) => a.end - b.end);
  BACKUP_KEYS.filter(k => k !== 'history' && d[k] != null).forEach(k => { S[k] = d[k]; });
  S = normalize(S); applyTheme(); afterChange();
  toast(`Backup restored. ${plural(added, 'workout')} added.`);
}
function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  t = t.replace(/^﻿/, '');
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); f = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
const MON = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function hevyDate(s) {
  s = (s || '').trim();
  const m = /(\d{1,2}) (\w{3})\w* (\d{4}),? (\d{1,2}):(\d{2})/.exec(s);
  if (m && MON[m[2].toLowerCase()] !== undefined) return new Date(+m[3], MON[m[2].toLowerCase()], +m[1], +m[4], +m[5]).getTime();
  const t = Date.parse(s); return isNaN(t) ? 0 : t;
}
function importHevy(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('That file looks empty.'); return; }
  const h = rows[0].map(x => norm(x)), ix = n => h.indexOf(n);
  const iT = ix('start_time'), iE = ix('end_time'), iN = ix('exercise_title'), iS = ix('set_type'), iR = ix('reps');
  let iW = ix('weight_lbs'), kg = false; if (iW < 0) { iW = ix('weight_kg'); kg = iW >= 0; }
  if (iT < 0 || iN < 0 || iR < 0 || iW < 0) { toast("This doesn't look like a Hevy export."); return; }
  const groups = {};
  rows.slice(1).forEach(r => {
    const st = hevyDate(r[iT]); if (!st) return;
    if (iS >= 0 && norm(r[iS] || '') === 'warmup') return;
    const name = (r[iN] || '').trim(); if (!name) return;
    const w = groups[st] = groups[st] || {id:st, start:st, end:(iE >= 0 && hevyDate(r[iE])) || st + 36e5, cat:null, muscles:[], exercises:[], idx:{}};
    let e = w.idx[name]; if (!e) { e = w.idx[name] = {name, sets:[]}; w.exercises.push(e); }
    let wt = num(r[iW]); if (kg && S.unit === 'lb') wt *= 2.20462; if (!kg && S.unit === 'kg') wt *= .453592;
    e.sets.push({w:String(Math.round(wt * 10) / 10), r:String(num(r[iR]))});
  });
  const have = new Set(S.history.map(w => w.id)); let n = 0;
  Object.values(groups).forEach(w => {
    delete w.idx;
    if (have.has(w.id) || !w.exercises.length) return;
    w.exercises.forEach(e => {
      const info = exInfo(e.name);
      if (info) info.muscles.forEach(m => { if (!w.muscles.includes(m)) w.muscles.push(m); });
      else S.ex.push({id:'h' + w.id + '-' + S.ex.length, name:e.name, cats:[], muscles:[], how:'Imported from Hevy. Add muscles and notes here.'});
    });
    S.history.push(w); n++;
  });
  S.history.sort((a, b) => a.end - b.end);
  afterChange(); toast(n ? `Imported ${plural(n, 'workout')} from Hevy.` : 'No new workouts found in that file.');
}

/* =========================================================
   Photos (IndexedDB)
   ========================================================= */
const idb = () => new Promise((ok, no) => { const r = indexedDB.open('liftlog', 1); r.onupgradeneeded = () => r.result.createObjectStore('p', {keyPath:'id'}); r.onsuccess = () => ok(r.result); r.onerror = no; });
const pdo = (mode, fn) => idb().then(db => new Promise((ok, no) => { const t = db.transaction('p', mode), q = fn(t.objectStore('p')); t.oncomplete = () => ok(q.result); t.onerror = no; }));
const pAll = () => pdo('readonly', s => s.getAll()).catch(() => []);
const pPut = o => pdo('readwrite', s => s.put(o));
const pDel = id => pdo('readwrite', s => s.delete(id));
async function loadPhotos() { PH = (await pAll()).sort((a, b) => b.id - a.id); checkBadges(); save(); if (S.tab === 'body' || S.tab === 'badges') render(); }
function addPhoto(file) {
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      pPut({id:Date.now(), d:today(), url:c.toDataURL('image/jpeg', .78)}).then(() => { loadPhotos(); toast('Photo saved.'); }, () => toast("Couldn't save the photo."));
    };
    im.onerror = () => toast("Couldn't read that photo.");
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* =========================================================
   Theme
   ========================================================= */
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'sakura') r.removeAttribute('data-skin'); else r.setAttribute('data-skin', S.theme);
  const t = THEMES.find(x => x[0] === S.theme); const m = $('meta[name="theme-color"]'); if (m && t) m.content = t[2];
}

/* =========================================================
   Events
   ========================================================= */
function afterChange() { checkBadges(); save(); render(); }
let armed = null, armTimer;
function disarm() { if (armed) { armed.textContent = armed.dataset.label; armed.classList.remove('armed'); armed = null; } clearTimeout(armTimer); }

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    const g = nav.dataset.nav;
    if (TAB_INFO[S.tab].g !== g) { go(S.last[g] && GROUPS[g].includes(S.last[g]) ? S.last[g] : GROUPS[g][0]); save(); render(); scrollTo(0, 0); }
    return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.hasAttribute('data-confirm') && armed !== b) {
    disarm(); armed = b; b.dataset.label = b.textContent; b.textContent = 'Tap again to confirm'; b.classList.add('armed');
    armTimer = setTimeout(disarm, 3000); return;
  }
  armed = null; clearTimeout(armTimer);
  const fn = ACT[b.dataset.act] || JACT[b.dataset.act] || MACT[b.dataset.act] || SACT[b.dataset.act] || XACT[b.dataset.act]; if (!fn) return;
  unlockAudio();
  const wasTab = S.tab;
  if (fn(b.dataset, b) === false) return;
  afterChange();
  if (S.tab !== wasTab) scrollTo(0, 0);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cvJ' || t.id === 'cvU') { const r = R(), v = num(t.value), o = $(t.id === 'cvJ' ? '#cvU' : '#cvJ'); o.value = t.value.trim() === '' ? '' : t.id === 'cvJ' ? (v / r).toFixed(2) : String(Math.round(v * r)); return; }
  if (t.id === 'knSearch') { KQ = t.value; $('#knList').innerHTML = knList(); return; }
  if (t.id === 'payAmt') { $('#payPrev').innerHTML = payPreview(num(t.value)); return; }
  if (t.dataset.bind === 'kgrade') { const x = S.sc.tasks.find(q => q.id === t.dataset.id); if (x) { x[t.dataset.f] = t.value; save(); } return; }
  if (t.id === 'mdSearch') { MQ = t.value; $('#mdList').innerHTML = mdList(); return; }
  if (t.dataset.bind === 'jj') { const k = t.dataset.k; S.jp.journal[k] = S.jp.journal[k] || {}; S.jp.journal[k][t.dataset.f] = t.value; save(); return; }
  if (t.dataset.bind === 'jnotes') { S.jp.notes = t.value; save(); return; }
  if (t.id === 'plateW') { UI.plates.w = t.value; $('#plateOut').innerHTML = plateResult(); return; }
  if (t.dataset.bind === 'tplname') { const x = S.tpl.find(q => q.id === t.dataset.id); if (x && t.value.trim()) { x.name = t.value.trim(); save(); } return; }
  if (t.id === 'exSearch') { Q = t.value; $('#exList').innerHTML = exList(); return; }
  switch (t.dataset.bind) {
    case 'set': { const s = S.active && S.active.exercises[+t.dataset.x] && S.active.exercises[+t.dataset.x].sets[+t.dataset.s]; if (s) { s[t.dataset.f] = t.value; save(); } break; }
    case 'nf': NF[t.dataset.f] = t.value; break;
    case 'ns': NS[t.dataset.f] = t.value; break;
    case 'journal': JD.t = t.value; break;
    case 'dose': { const x = S.sup.find(s => s.id === t.dataset.id); if (x) { x.dose = t.value; save(); } break; }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bind === 'modevis') {
    const k = t.dataset.k; S.hidden = S.hidden.filter(x => x !== k); if (!t.checked) S.hidden.push(k);
    toast(t.checked ? `${MODES[k].label} is showing.` : `${MODES[k].label} is hidden.`); save(); render(); return;
  }
  if (t.dataset.bind === 'svfreq') { S.sv.freq = t.value; save(); render(); return; }
  if (t.dataset.bind === 'mstatus') { const m = mFind(t.dataset.id); if (m) { const was = m.status; m.status = t.value; m.updated = Date.now(); if (t.value === 'done' && was !== 'done') { m.finished = Date.now(); if (m.total) m.prog = Math.max(m.prog || 0, m.total); } afterChange(); } return; }
  if (t.dataset.bind === 'msort') { S.md.sort = t.value; save(); render(); return; }
  if (t.dataset.bind === 'jjday') { S.jp.jsel = t.value; save(); render(); return; }
  if (t.type === 'file') {
    const f = t.files && t.files[0]; const kind = t.dataset.file; t.value = ''; if (!f) return;
    if (kind === 'photo') addPhoto(f);
    else if (kind === 'restore') f.text().then(restoreFrom);
    else if (kind === 'hevy') f.text().then(importHevy);
    return;
  }
  if (t.dataset.bind === 'pick') { S.pick = t.value; save(); render(); }
  else if (t.dataset.bind === 'setting') {
    const k = t.dataset.k; S[k] = (k === 'unit' || k === 'rr') ? t.value : +t.value;
    if (k === 'unit') { S.inc = null; S.bar = null; }
    afterChange();
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape' && UI.plates) { UI.plates = null; render(); return; }
  const ef = t.dataset && t.dataset.enter && (ACT[t.dataset.enter] || JACT[t.dataset.enter] || MACT[t.dataset.enter] || SACT[t.dataset.enter] || XACT[t.dataset.enter]);
  if (e.key === 'Enter' && ef) { e.preventDefault(); if (ef(t.dataset, t) !== false) afterChange(); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.keep) UI.open[d.dataset.keep] = d.open; }, true);
document.addEventListener('visibilitychange', tick);


/* =========================================================
   Start
   ========================================================= */
applyTheme();
render();
locked = !!S.pin; drawLock();
setInterval(tick, 250);
loadPhotos();
try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').then(reg => { document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); }); }).catch(() => {}); } catch (e) {}
</script>
